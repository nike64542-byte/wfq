name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Install & Enable OpenSSH Server
        run: |
          # 安装 OpenSSH Server 组件
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0

          # 启动 sshd 并设为开机自启
          Start-Service sshd
          Set-Service -Name sshd -StartupType Automatic

          # 防火墙放行 22 端口（所有 Profile，避免 Tailscale 网卡被识别为 Public 后拦截）
          if (-not (Get-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -Profile Any
          } else {
              Set-NetFirewallRule -Name 'OpenSSH-Server-In-TCP' -Enabled True -Profile Any
          }

          # 默认 Shell 换成 PowerShell（可选，登录后体验更好）
          if (-not (Test-Path "HKLM:\SOFTWARE\OpenSSH")) {
              New-Item -Path "HKLM:\SOFTWARE\OpenSSH" -Force | Out-Null
          }
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force

          # 确认
          Write-Host "sshd status: $((Get-Service sshd).Status)"
          Get-Content C:\ProgramData\ssh\sshd_config | Select-String -Pattern 'PasswordAuthentication|PubkeyAuthentication'

      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # Download and install Tailscale silently
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # Connect to Tailscale network
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          # 等待 Tailscale IP 就绪
          $ts_ip = $null
          for ($i = 0; $i -lt 30; $i++) {
              $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4 2>$null
              if ($ts_ip) { break }
              Start-Sleep -Seconds 3
          }

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host ""
          Write-Host "  [RDP] mstsc  ->  $ts_ip" -ForegroundColor Magenta
          Write-Host "  [SSH] ssh NvdAdmin@$ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
