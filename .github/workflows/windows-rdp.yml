name: Kali Cloud SSH + RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 1. Start Kali Linux container
        run: |
          docker pull kalilinux/kali-rolling
          docker run -d \
            --name kali-cloud \
            --privileged \
            --device=/dev/net/tun \
            kalilinux/kali-rolling \
            sleep infinity

      - name: 2. Install SSH, RDP, Desktop Environment & Tools
        run: |
          docker exec kali-cloud bash -c "
            apt-get update &&
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              openssh-server \
              sudo \
              curl \
              ca-certificates \
              xrdp \
              xfce4 \
              xfce4-terminal \
              dbus-x11 \
              xorgxrdp \
              --no-install-recommends
            update-ca-certificates
          "

      - name: 3. Configure Users and Services
        run: |
          docker exec kali-cloud bash -c "
            echo 'root:P@ssw0rd1qazXSW@#' | chpasswd &&
            useradd -m -s /bin/bash nvdadmin &&
            echo 'nvdadmin:P@ssw0rd1qazXSW@#' | chpasswd &&
            usermod -aG sudo nvdadmin &&
            echo 'xfce4-session' > /home/nvdadmin/.xsession &&
            chown nvdadmin:nvdadmin /home/nvdadmin/.xsession &&
            sed -i 's/^#*AllowRootLogin=.*/AllowRootLogin=false/' /etc/xrdp/sesman.ini
          "

      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # 容器内安装tailscale
          docker exec kali-cloud bash -c "curl -fsSL https://tailscale.com/install.sh | sh"

          # 使用docker run -d在容器后台常驻tailscaled，不要用&后台（exec退出会销毁进程）
          docker exec -d kali-cloud /usr/sbin/tailscaled --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock
          sleep 8

          docker exec kali-cloud bash -c "tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=kali-cloud"
          sleep 10
          
          TAILSCALE_IP=$(docker exec kali-cloud tailscale ip -4)
          echo "=========================================="
          echo "  >>> KALI CLOUD SERVER IS READY! <<<"
          echo "  Tailscale IP : $TAILSCALE_IP"
          echo "------------------------------------------"
          echo "  SSH Connection:"
          echo "    ssh nvdadmin@$TAILSCALE_IP"
          echo "    Password: P@ssw0rd1qazXSW@#"
          echo "------------------------------------------"
          echo "  RDP Connection:"
          echo "    Address: $TAILSCALE_IP:3389"
          echo "    Username: nvdadmin"
          echo "    Password: P@ssw0rd1qazXSW@#"
          echo "------------------------------------------"
          echo "  >> Use xfreerdp or Windows Remote Desktop"
          echo "=========================================="

      - name: 5. Start SSH & RDP Services and Keep Alive
        run: |
          docker exec kali-cloud bash -c "
            /usr/sbin/sshd
            /etc/init.d/xrdp start
          "
          
          for i in $(seq 1 360); do
            sleep 60
            echo "[$i/360] Server running... (container: $(docker inspect -f '{{.State.Running}}' kali-cloud))"
            docker exec kali-cloud bash -c "pgrep sshd >/dev/null && echo 'SSH: OK' || echo 'SSH: FAILED'"
            docker exec kali-cloud bash -c "pgrep xrdp >/dev/null && echo 'RDP: OK' || echo 'RDP: FAILED'"
            docker exec kali-cloud bash -c "pgrep tailscaled >/dev/null && echo 'Tailscale: OK' || echo 'Tailscale: FAILED'"
          done
